{{define "head"}}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>{{.Title}}</title>
{{end}}

{{define "css"}}<style>
/* ─────────────────────────────────────────────────────────────
   放映间台账 · 样式底座
   单色系统承载内容，强调色只表示「走片」（进度 / 当前项 / 焦点）。
   ───────────────────────────────────────────────────────────── */

:root{
  --bg:#0F1215;
  --surface:#151A1E;
  --surface-2:#1C2328;
  --line:#272E34;
  --ink:#EDEAE3;
  --ink-2:#A0A5A8;
  --ink-3:#727879;
  --burn:#E1483C;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","Source Han Serif CN","SimSun",Georgia,serif;
  --sans:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  --gut:clamp(18px,4vw,48px);
  --ease:cubic-bezier(.22,.61,.36,1);
}

:root[data-theme="light"]{
  --bg:#F2F3F2;
  --surface:#FFFFFF;
  --surface-2:#E7E9E7;
  --line:#D5D8D5;
  --ink:#15181A;
  --ink-2:#5B6165;
  --ink-3:#82888B;
  --burn:#B8342B;
}

@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#F2F3F2;
    --surface:#FFFFFF;
    --surface-2:#E7E9E7;
    --line:#D5D8D5;
    --ink:#15181A;
    --ink-2:#5B6165;
    --ink-3:#82888B;
    --burn:#B8342B;
  }
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.66 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
img{max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--burn);outline-offset:3px}
::selection{background:var(--burn);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 骨架：书脊导轨 + 内容栏 ───────────────────────────────── */
.shell{min-height:100vh;min-height:100svh}
.rail{display:none}
.main{
  width:100%;max-width:1460px;margin:0 auto;
  padding:0 var(--gut);
}
@media (min-width:920px){
  .shell{display:grid;grid-template-columns:88px minmax(0,1fr)}
  .rail{
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    position:sticky;top:0;height:100vh;height:100svh;padding:26px 0 22px;
    border-right:1px solid var(--line);
  }
  .rail-top{display:flex;flex-direction:column;align-items:center;gap:20px;min-height:0}
  .mark{width:5px;height:5px;background:var(--burn);flex:none}
  .wordmark{
    writing-mode:vertical-rl;font-family:var(--serif);font-size:14px;
    letter-spacing:.34em;color:var(--ink-2);max-height:56vh;overflow:hidden;
  }
  .rail-set{
    writing-mode:vertical-rl;font-size:11.5px;letter-spacing:.26em;
    color:var(--ink-3);padding:8px 0;
  }
  .rail-set:hover{color:var(--ink)}
  .main{margin:0;max-width:none}
}

/* ── 顶栏：搜索 / 筛选 / 排序 ─────────────────────────────── */
.bar{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:clamp(12px,2vw,26px);padding:22px 0 16px;
}
.brand{display:none}
@media (max-width:919px){
  .bar{gap:12px 14px;padding:16px 0 12px}
  .brand{
    display:flex;align-items:baseline;gap:10px;order:1;flex:1 1 auto;
    font-family:var(--serif);font-size:16px;letter-spacing:.06em;color:var(--ink);
  }
  .brand i{width:5px;height:5px;background:var(--burn);display:inline-block}
  .bar .sort{order:2}
  .bar .set-inline{order:2;display:inline-block;font-size:13px;color:var(--ink-3);padding-left:2px}
  .bar .set-inline:hover{color:var(--ink)}
  .bar .search{order:3;flex:1 0 100%}
  .bar .filters{order:4;flex:1 0 100%}
}
.set-inline{display:none}
.search{
  flex:1 1 200px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);padding-bottom:7px;
  transition:border-color .2s var(--ease);
}
.search:focus-within{border-bottom-color:var(--ink)}
.search svg{width:15px;height:15px;flex:none;color:var(--ink-3)}
.search input{
  flex:1;min-width:0;background:none;border:0;outline:0;padding:2px 0;
  color:var(--ink);font:400 15px var(--sans);
}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{filter:grayscale(1) opacity(.5)}

.filters{display:flex;gap:clamp(12px,1.6vw,20px);flex:none}
.filters a{
  font-size:14px;color:var(--ink-2);padding-bottom:6px;
  border-bottom:2px solid transparent;
  transition:color .18s var(--ease),border-color .18s var(--ease);
}
.filters a:hover{color:var(--ink)}
.filters a[aria-current]{color:var(--ink);border-bottom-color:var(--burn)}

.sort{position:relative;flex:none}
.sort select{
  appearance:none;-webkit-appearance:none;background:none;border:0;
  color:var(--ink-2);font:400 14px var(--sans);padding:0 16px 0 0;cursor:pointer;
}
.sort::after{
  content:"";position:absolute;right:2px;top:50%;width:0;height:0;
  margin-top:-2px;border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid var(--ink-3);pointer-events:none;
}
.sort select:hover{color:var(--ink)}
.sort select option{background:var(--surface);color:var(--ink)}

/* ── 继续观看 ─────────────────────────────────────────────── */
.resume{
  display:grid;grid-template-columns:1fr;margin:4px 0 clamp(28px,4vw,48px);
  border-bottom:1px solid var(--line);
}
@media (min-width:840px){
  .resume{
    grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
    column-gap:clamp(22px,3vw,44px);align-items:center;   /* 文本与剧照垂直居中，别贴着顶边 */
  }
}
/* 剧照按 16:9 原比例出图：宽度决定高度，不裁切，窗口再宽也不会切掉人脸 */
.resume-art{
  position:relative;display:block;width:100%;aspect-ratio:16/9;
  background:var(--surface-2);overflow:hidden;
}
.resume-art img{width:100%;height:100%;object-fit:cover;display:block}
.resume-art::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.resume-body{padding:14px 0 18px;min-width:0}
@media (min-width:840px){.resume-body{padding:0}}
.resume-kicker{margin:0;font-size:12.5px;letter-spacing:.06em;color:var(--ink-3)}
.resume h2{
  margin:8px 0 6px;font-family:var(--serif);font-weight:400;
  font-size:clamp(23px,3.2vw,34px);line-height:1.22;letter-spacing:.01em;
}
.resume h2 a:hover{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.resume-sub{margin:0;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.resume-ov{
  margin:12px 0 18px;font-size:14px;line-height:1.7;color:var(--ink-2);max-width:46ch;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.resume-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.resume-bar{position:relative;grid-column:1/-1;height:2px;background:var(--surface-2);margin-top:16px}
.resume-bar span{
  display:block;height:100%;width:0;background:var(--burn);
  transition:width .9s var(--ease) .15s;
}

/* ── 接着看 ───────────────────────────────────────────────── */
.strip-wrap{margin:0 0 clamp(26px,3.4vw,44px)}
.strip-h{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:0 0 12px;font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;
}
.strip{
  display:flex;gap:clamp(12px,1.4vw,18px);overflow-x:auto;margin:0;padding:0 0 8px;
  list-style:none;scroll-snap-type:x proximity;scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
}
.strip li{flex:0 0 132px;scroll-snap-align:start;min-width:0}
.strip .poster{aspect-ratio:2/3}
.strip .t{
  -webkit-line-clamp:1;min-height:0;font-size:13px;line-height:1.35;margin-top:8px;
}
.strip .m{font-size:11.5px;margin-top:3px}

/* ── 接触印：海报格 ───────────────────────────────────────── */
.sheet{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:0 0 9px;border-bottom:1px solid var(--line);
  margin:0 0 clamp(18px,2.2vw,26px);
}
.sheet p{margin:0;font-size:13px;color:var(--ink-2)}
.sheet .n{color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));
  gap:clamp(20px,2.4vw,32px) clamp(13px,1.5vw,20px);
  margin:0;padding:0;list-style:none;
}
.frame{margin:0;min-width:0}
.poster{
  position:relative;display:block;aspect-ratio:2/3;
  background:var(--surface-2);overflow:hidden;
}
.poster img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:filter .28s var(--ease);
}
.poster:hover img{filter:brightness(1.09)}
.ph{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif);font-size:clamp(26px,3vw,36px);color:var(--ink-2);
  box-shadow:inset 0 0 0 1px var(--line);
  background:linear-gradient(to bottom right,transparent 49.6%,var(--line) 49.6%,var(--line) 50.4%,transparent 50.4%);
}
.burn{position:absolute;left:0;bottom:0;height:2px;background:var(--burn)}
.frame .t{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-top:9px;font-size:14.5px;line-height:1.38;color:var(--ink);
  min-height:2.76em;
}
.frame .t:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.frame .m{
  margin:4px 0 0;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  display:flex;gap:6px;flex-wrap:wrap;
}
.frame .m .w{color:var(--ink-2)}

/* ── 分页 ─────────────────────────────────────────────────── */
.pager{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin:clamp(30px,4vw,52px) 0 clamp(40px,5vw,72px);
  padding-top:16px;border-top:1px solid var(--line);font-size:14px;
}
.pager a{color:var(--ink)}
.pager a:hover{text-decoration:underline;text-underline-offset:5px}
.pager .off{color:var(--ink-3);opacity:.55}
.pager .at{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px}

/* ── 空态 ─────────────────────────────────────────────────── */
.empty{padding:clamp(40px,7vw,90px) 0;max-width:44ch}
.empty .e-t{margin:0 0 8px;font-family:var(--serif);font-size:clamp(20px,2.4vw,26px)}
.empty p{margin:0 0 18px;font-size:14px;color:var(--ink-2)}

/* ── 按钮 ─────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border:1px solid transparent;border-radius:1px;
  background:var(--ink);color:var(--bg);cursor:pointer;
  font:500 14.5px/1.1 var(--sans);
  transition:opacity .18s var(--ease),background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease);
}
.btn:hover{opacity:.86}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.quiet{
  background:none;border:0;color:var(--ink-2);padding:11px 4px;
  text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--line);
}
.btn.quiet:hover{color:var(--ink);text-decoration-color:var(--ink);opacity:1}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ── 页面顶部的一条细导航 ─────────────────────────────────── */
.crumb{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:20px 0 2px;font-size:13.5px;color:var(--ink-2);
}
.crumb a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
@media (min-width:920px){.crumb .set-top{display:none}}

/* ── 详情页 ───────────────────────────────────────────────── */
/* 详情页：左边一张目录卡（海报 + 标题 + 数据 + 按钮），右边一张装裱好的剧照。
   剧照按 16:9 出图、contain 填框，任何比例的底图都完整显示，不再裁上下 */
.hero{
  display:grid;grid-template-columns:minmax(0,1fr);
  gap:clamp(18px,2.6vw,34px);margin-top:clamp(12px,2vw,22px);
}
@media (min-width:920px){
  .hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center}
}
.hero-card{
  display:grid;grid-template-columns:104px minmax(0,1fr);
  column-gap:16px;align-items:start;min-width:0;
}
@media (min-width:920px){
  .hero-card{grid-template-columns:172px minmax(0,1fr);column-gap:clamp(20px,2.4vw,32px);align-items:center}
}
.hero-still{
  margin:0;position:relative;aspect-ratio:16/9;overflow:hidden;
  background:var(--surface-2);outline:1px solid var(--line);
}
.hero-still img{width:100%;height:100%;object-fit:contain;display:block}
@media (max-width:919px){.hero-still{order:-1}}
.hero-poster{
  position:relative;aspect-ratio:2/3;background:var(--surface-2);overflow:hidden;
  outline:1px solid var(--line);
}
.hero-poster img{width:100%;height:100%;object-fit:cover;display:block}
.hero-text{min-width:0}
.hero.no-art{grid-template-columns:minmax(0,1fr)}
.hero.no-art .hero-text{max-width:62ch}
.hero-text h1{
  margin:0;font-family:var(--serif);font-weight:400;
  font-size:clamp(25px,4.4vw,44px);line-height:1.14;letter-spacing:.01em;text-wrap:balance;
}
.orig{margin:8px 0 0;font-size:13.5px;color:var(--ink-3);letter-spacing:.02em}
.facts{
  display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;padding:0;list-style:none;
  font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;
}
.facts li{display:flex;align-items:center;gap:6px}
.rating{color:var(--ink)}
.rating b{font-weight:500}
.tagline{
  margin:16px 0 0;font-family:var(--serif);font-size:16px;line-height:1.6;
  color:var(--ink-2);max-width:48ch;
}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:22px 0 0}
.hero-bar{position:relative;height:2px;background:var(--surface-2);margin-top:18px;max-width:420px}
.hero-bar span{display:block;height:100%;background:var(--burn)}

.detail-body{
  display:grid;grid-template-columns:1fr;gap:clamp(28px,4vw,56px);
  margin:clamp(30px,4vw,52px) 0 clamp(40px,6vw,80px);
}
@media (min-width:900px){
  .detail-body{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
}
.col h2{margin:0 0 12px;font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--ink-2)}
.col section+section{margin-top:clamp(26px,3vw,38px)}
.ov{margin:0;font-size:15px;line-height:1.8;color:var(--ink);max-width:66ch;white-space:pre-line}
.meta{margin:0;font-size:13.5px}
.meta div{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.meta dt{color:var(--ink-3);font-size:12.5px}
.meta dd{margin:0;color:var(--ink)}
.meta dd a:hover{text-decoration:underline;text-underline-offset:4px}
.cast{display:grid;grid-template-columns:1fr;gap:0 32px;margin:0;padding:0;list-style:none}
@media (min-width:640px){.cast{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cast li{
  display:flex;align-items:baseline;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;min-width:0;
}
.cast .r{
  color:var(--ink-3);font-size:12.5px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.subs{list-style:none;margin:0;padding:0}
.subs li{
  display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:13.5px;min-width:0;
}
.subs .lab{flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subs .acts{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.tag{
  flex:none;font-size:11px;letter-spacing:.04em;color:var(--ink-3);
  border:1px solid var(--line);padding:1px 6px;border-radius:1px;
}
.subs a.dl{color:var(--ink-2);font-size:12.5px}
.subs a.dl:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.upload{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;font-size:12.5px;color:var(--ink-3)}
.upload input[type=file]{font-size:12px;color:var(--ink-2);max-width:100%}
.upload input[type=file]::file-selector-button{
  background:none;border:1px solid var(--line);color:var(--ink-2);
  padding:6px 10px;margin-right:10px;cursor:pointer;border-radius:1px;font:400 12px var(--sans);
}
.upload select{
  background:none;border:1px solid var(--line);color:var(--ink-2);
  padding:6px 8px;border-radius:1px;font:400 12px var(--sans);
}
.note{
  margin:14px 0 0;padding:10px 12px;border-left:2px solid var(--ink-3);
  background:var(--surface);font-size:12.5px;line-height:1.6;color:var(--ink-2);
}
.note.warn{border-left-color:var(--burn)}

/* ── 设置页 ───────────────────────────────────────────────── */
.set-head{margin:clamp(24px,3vw,34px) 0 22px}
.set-head h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,34px)}
.set-head p{margin:10px 0 0;font-size:13.5px;color:var(--ink-2);max-width:62ch}
.set-form{max-width:820px}
.sec{margin:0 0 clamp(26px,3vw,36px);padding-top:20px;border-top:1px solid var(--line)}
.sec h2{margin:0 0 6px;font-size:14px;font-weight:500;letter-spacing:.02em}
.sec .hint{margin:0 0 18px;font-size:12.5px;color:var(--ink-3);max-width:64ch;line-height:1.65}
.row{display:grid;grid-template-columns:1fr;gap:6px;margin:0 0 14px}
@media (min-width:720px){
  .row{grid-template-columns:184px minmax(0,1fr);gap:20px;align-items:start}
  .row>label,.row>.rl{padding-top:10px}
}
.row>label,.row>.rl{font-size:13px;color:var(--ink-2)}
.set-form input[type=text],.set-form input[type=password],.set-form textarea,.set-form select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:1px;
  color:var(--ink);padding:9px 11px;font:400 14px var(--sans);
  transition:border-color .18s var(--ease);
}
.set-form input[type=text]:focus,.set-form input[type=password]:focus,.set-form textarea:focus,.set-form select:focus{
  border-color:var(--ink);outline:none;
}
.set-form textarea{resize:vertical;min-height:84px;line-height:1.6}
.fld-note{margin:6px 0 0;font-size:12px;color:var(--ink-3)}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink);padding-top:8px}
.check input{width:15px;height:15px;accent-color:var(--burn)}
.seg{display:flex;border:1px solid var(--line);border-radius:1px;width:max-content;max-width:100%}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{
  display:block;padding:8px 16px;font-size:13px;color:var(--ink-2);cursor:pointer;
  border-right:1px solid var(--line);
}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--ink);color:var(--bg)}
.seg input:focus-visible+span{outline:2px solid var(--burn);outline-offset:-2px}
.msg{
  margin:0 0 22px;padding:11px 14px;border-left:2px solid var(--ink);
  background:var(--surface);font-size:13px;line-height:1.65;color:var(--ink);
}
.msg.err{border-left-color:var(--burn)}
.msg .p{display:block;margin-top:8px;font-size:12px;color:var(--ink-3);word-break:break-all}
.probe{
  margin:12px 0 0;padding:12px;background:var(--surface);border:1px solid var(--line);
  font-size:11.5px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;
  max-height:260px;overflow:auto;
}
.set-foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;
  padding:18px 0 clamp(40px,6vw,72px);border-top:1px solid var(--line);
  margin-top:clamp(18px,2vw,26px);
}
.set-foot .pathline{font-size:12px;color:var(--ink-3);word-break:break-all;flex:1 1 240px}

/* ── 动效与降级 ───────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
